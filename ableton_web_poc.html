<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ableton Web POC</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      button { padding: 10px 14px; border-radius: 10px; border: 1px solid #ccc; background: #f7f7f7; cursor: pointer; }
      button:active { transform: translateY(1px); }
      input { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; }
      .card { border: 1px solid #e5e5e5; border-radius: 14px; padding: 16px; max-width: 720px; }
      .small { color: #666; font-size: 13px; }
      pre { background: #111; color: #eee; padding: 12px; border-radius: 12px; overflow: auto; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ableton Web POC</h1>
      <p class="small">
        This page calls a local Python FastAPI server which sends AbletonOSC messages to Ableton Live.
      </p>

      <div class="row">
        <button id="play">Play</button>
        <button id="stop">Stop</button>
      </div>

      <div class="row">
        <input id="tempo" type="number" step="0.1" value="142" />
        <button id="setTempo">Set Tempo</button>
      </div>

      <div class="row">
        <input id="track" type="number" value="0" />
        <input id="slot" type="number" value="0" />
        <button id="fire">Fire Clip (track, slot)</button>
      </div>

      <div class="small">Log</div>
      <pre id="log"></pre>
    </div>

    <script>
      const API_BASE = "http://127.0.0.1:8005";
      const logEl = document.getElementById("log");

      function log(msg) {
        logEl.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logEl.textContent;
      }

      async function post(path, body) {
        const res = await fetch(`${API_BASE}${path}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : "{}",
        });
        const text = await res.text();
        if (!res.ok) throw new Error(text);
        return text ? JSON.parse(text) : {};
      }

      document.getElementById("play").addEventListener("click", async () => {
        try {
          await post("/transport/play");
          log("Play sent");
        } catch (e) {
          log(`Error: ${e.message}`);
        }
      });

      document.getElementById("stop").addEventListener("click", async () => {
        try {
          await post("/transport/stop");
          log("Stop sent");
        } catch (e) {
          log(`Error: ${e.message}`);
        }
      });

      document.getElementById("setTempo").addEventListener("click", async () => {
        try {
          const bpm = parseFloat(document.getElementById("tempo").value);
          await post("/transport/tempo", { bpm });
          log(`Tempo set to ${bpm}`);
        } catch (e) {
          log(`Error: ${e.message}`);
        }
      });

      document.getElementById("fire").addEventListener("click", async () => {
        try {
          const track_index = parseInt(document.getElementById("track").value, 10);
          const clip_slot_index = parseInt(document.getElementById("slot").value, 10);
          await post("/clips/fire", { track_index, clip_slot_index });
          log(`Fire clip track=${track_index} slot=${clip_slot_index}`);
        } catch (e) {
          log(`Error: ${e.message}`);
        }
      });

      log("Ready. Start the server and ensure AbletonOSC is running.");
    </script>
  </body>
</html>
